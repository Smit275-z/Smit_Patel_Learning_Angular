<mat-card appHoverHighlight="lightblue" [class.even]="index % 2 === 0" [class.odd]="index % 2 !== 0">
  <mat-card-header>
    <mat-card-title>{{ content.title }}</mat-card-title>
    <mat-card-subtitle>{{ content.category }}</mat-card-subtitle>
  </mat-card-header>
  
  <!-- Display the image if available -->
  <img mat-card-image [src]="content.imageUrl" alt="{{ content.title }}" *ngIf="content.imageUrl">
  
  <mat-card-content>
    <p class="price">Price: ${{ content.price }}</p>
    <p class="description">{{ content.description }}</p>
    <p class="summary"><strong>Summary:</strong> {{ content | contentSummary }}</p>
  </mat-card-content>
  
  <mat-card-actions>
    <button mat-raised-button color="accent">Buy Now</button>
  </mat-card-actions>
</mat-card>
