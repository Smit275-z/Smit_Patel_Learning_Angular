<mat-toolbar color="primary">
  <span>Product List</span>
</mat-toolbar>

<mat-divider></mat-divider>

<mat-card>
  <mat-card-content>
    <mat-grid-list cols="2" rowHeight="1:1" gutterSize="10px">
      <mat-grid-tile *ngFor="let content of contents$ | async; index as i">
        <app-content-list-item 
          [content]="content" 
          [index]="i">
        </app-content-list-item>
      </mat-grid-tile>
    </mat-grid-list>
  </mat-card-content>
</mat-card>
